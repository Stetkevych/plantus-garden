      else if (it.kind === 'boost') drawBoost(ctx, x, it.y, it.type, g.t + it.wob);
      else drawObstacle(ctx, x, it.y, it.type, g.t + it.wob);
    }

    // bees
    const lift = Math.sin((1 - g.hop / 0.55) * Math.PI) * 34 * (g.hop > 0 ? 1 : 0);
    const positions = g.swarm >= 5
      ? [[LANES[0], BEE_Y + 22], [LANES[1], BEE_Y + 22], [LANES[2], BEE_Y + 22], [g.x - 30, BEE_Y - 26], [g.x + 30, BEE_Y - 26]]
      : g.swarm >= 3
        ? [[g.x - 62, BEE_Y + 14], [g.x + 62, BEE_Y + 14], [g.x, BEE_Y]]
        : [[g.x, BEE_Y]];

    if (g.hop > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(g.x, BEE_Y + 26, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    const blink = g.invuln > 0 && Math.floor(g.t * 14) % 2 === 0;
    ctx.globalAlpha = blink ? 0.35 : 1;
    for (const [bx, by] of positions) drawBee(ctx, bx, by - lift, g.t, g.shield);
    ctx.globalAlpha = 1;

    g.fx.draw(ctx);
    g.floats.draw(ctx);
    ctx.restore();

    hudBar(ctx, {
      score: Math.floor(g.score),
      label: `${Math.floor(g.dist / 10)}m`,
      right: `${'♥'.repeat(Math.min(5, g.lives))}${g.shield ? '  ⬡' : ''}`,
    });

    if (g.combo >= 2) {
      const m = mult();
      ctx.fillStyle = m >= 3 ? PALETTE.petal : PALETTE.chloro;
      rr(ctx, VW / 2 - 62, 54, 124, 26, 13); ctx.fill();
      text(ctx, `${g.combo} in a row  ×${m}`, VW / 2, 72, { size: 14, color: PALETTE.ink, align: 'center' });
    }
    if (g.swarm > 1) text(ctx, `SWARM ×${g.swarm}`, VW - 14, 100, { size: 13, color: PALETTE.pollen, align: 'right' });
    if (g.superT > 0) text(ctx, 'SUPER POLLINATION', VW - 14, 118, { size: 13, color: PALETTE.chloro, align: 'right' });
    if (g.magnetT > 0) text(ctx, 'MAGNET', VW - 14, 136, { size: 13, color: '#C79BE8', align: 'right' });

    if (g.bannerT > 0) {
      ctx.globalAlpha = Math.min(1, g.bannerT);
      text(ctx, g.banner, VW / 2, 130, { size: 20, color: g.bannerColor || PALETTE.pollen, align: 'center' });
      ctx.globalAlpha = 1;
    }
  };

  g.result = () => ({
    score: Math.floor(g.score),
    sun: Math.max(1, Math.floor(g.score * SUN_RATE.bee)),
    reason: g.reason || 'Run complete.',
    stats: [
      ['Flowers pollinated', g.pollinated],
      ['Best combo', g.bestCombo],
      ['Distance', `${Math.floor(g.dist / 10)} m`],
    ],
    lesson: 'The bee is not trying to pollinate. It wants nectar — pollen just sticks to it and rubs off on the next flower.',
  });

  return g;
}

function drawBee(ctx, x, y, t, shield) {
  ctx.save();
  ctx.translate(x, y);
  const flap = Math.sin(t * 40) * 0.5;
  if (shield) {
    ctx.strokeStyle = 'rgba(255,201,60,0.8)';
    ctx.lineWidth = 3;
    circle(ctx, 0, 0, 26 + Math.sin(t * 6) * 2); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(234,242,226,0.55)';
  ctx.save(); ctx.rotate(-0.5 + flap);
  ctx.beginPath(); ctx.ellipse(-4, -10, 13, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(0.5 - flap);
  ctx.beginPath(); ctx.ellipse(4, -10, 13, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  ctx.fillStyle = PALETTE.pollen;
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3A2E12';
  ctx.beginPath(); ctx.ellipse(-3, 0, 3.4, 11.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, 0, 3, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3A2E12';
  circle(ctx, -11, -3, 2); ctx.fill();
  ctx.restore();
}

function drawFlower(ctx, x, y, hue, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = PALETTE.chloroDk; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, 30); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + t * 0.6;
    ctx.fillStyle = hue;
    ctx.beginPath(); ctx.ellipse(Math.cos(a) * 12, Math.sin(a) * 12, 8, 8, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = PALETTE.pollen; circle(ctx, 0, 0, 8); ctx.fill();
  ctx.fillStyle = '#8A5A38'; circle(ctx, 0, 0, 4); ctx.fill();
  ctx.restore();
}

function drawBoost(ctx, x, y, type, t) {
  const c = BOOSTS[type].color;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(t * 2) * 0.2);
  ctx.fillStyle = 'rgba(18,33,26,0.8)';
  circle(ctx, 0, 0, 21); ctx.fill();
  ctx.strokeStyle = c; ctx.lineWidth = 3;
  circle(ctx, 0, 0, 21); ctx.stroke();
  const glyph = { life: '♥', shield: '⬡', speed: '»', magnet: '∪', superp: '✿', swarm: '≡' }[type];
  text(ctx, glyph, 0, 7, { size: 20, color: c, align: 'center' });
  ctx.restore();
}

function drawObstacle(ctx, x, y, type, t) {
  const o = OBSTACLES[type];
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = o.color;
  ctx.strokeStyle = o.color;

  if (type === 'web') {
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 32, Math.sin(a) * 26); ctx.stroke();
    }
    for (let r = 10; r <= 30; r += 10) {
      ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.82, 0, 0, Math.PI * 2); ctx.stroke();
    }
  } else if (type === 'raindrop') {
    ctx.beginPath();
    ctx.moveTo(0, -22); ctx.quadraticCurveTo(16, 4, 0, 20); ctx.quadraticCurveTo(-16, 4, 0, -22);
    ctx.fill();
  } else if (type === 'bird') {
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    const f = Math.sin(t * 12) * 8;
    ctx.beginPath();
    ctx.moveTo(-26, 0 + f); ctx.quadraticCurveTo(-10, -12, 0, 0);
    ctx.quadraticCurveTo(10, -12, 26, 0 + f);
    ctx.stroke();
    ctx.fillStyle = '#5F7796'; circle(ctx, 0, 2, 7); ctx.fill();
  } else if (type === 'branch') {
    rr(ctx, -46, -8, 92, 16, 8); ctx.fill();
    ctx.fillStyle = PALETTE.chloroDk;
    circle(ctx, -24, -12, 8); ctx.fill();
    circle(ctx, 20, 12, 7); ctx.fill();
  } else if (type === 'sprinkler') {
    ctx.fillStyle = '#8FA9C9';
    rr(ctx, -6, -4, 12, 26, 4); ctx.fill();
    ctx.strokeStyle = PALETTE.rain; ctx.lineWidth = 3;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.quadraticCurveTo(i * 16, -26 - Math.sin(t * 6) * 4, i * 30, -6);
      ctx.stroke();
    }
  } else if (type === 'leaf') {
    ctx.save(); ctx.rotate(Math.sin(t * 3) * 0.8);
    ctx.beginPath();
    ctx.moveTo(-24, 0); ctx.quadraticCurveTo(0, -20, 24, 0); ctx.quadraticCurveTo(0, 20, -24, 0);
    ctx.fill(); ctx.restore();
  } else {
    ctx.fillStyle = '#6E4629';
    for (let i = -1; i <= 1; i++) rr(ctx, i * 22 - 5, -18, 10, 40, 3), ctx.fill();
    rr(ctx, -40, -6, 80, 9, 4); ctx.fill();
  }
  ctx.restore();
}
return createBeeRush;
})();

/* ===== js/games/seed-crush.js ===== */
const createSeedCrush = (() => {
// seed-crush.js — Match 3. Cleared seeds drop into the germination tray, and a seed
// only counts as germinated once the tray has water, warmth and oxygen — the three real
// requirements. Match 4 makes a sprout that clears a line; match 5 makes a taproot that
// clears every seed of one kind.


const COLS = 8, ROWS = 8, CELL = 56;
const OX = 16, OY = 176;
const MOVES = 26;

const SEEDS = [
  { id: 'sunflower', color: '#FFC93C', name: 'Sunflower' },
  { id: 'bean',      color: '#8BE06A', name: 'Bean' },
  { id: 'pumpkin',   color: '#FF9F45', name: 'Pumpkin' },
  { id: 'corn',      color: '#F0E27A', name: 'Corn' },
  { id: 'apple',     color: '#FF7EA8', name: 'Apple' },
  { id: 'acorn',     color: '#B98453', name: 'Acorn' },
];
const byId = (id) => SEEDS.find((s) => s.id === id);

let uid = 0;

function createSeedCrush() {
  const g = {
    grid: [],
    sel: null,
    moves: MOVES,
    score: 0,
    cleared: 0,
    cascade: 0,
    bestCascade: 0,
    phase: 'idle',
    timer: 0,
    fx: new Particles(),
    floats: new Floaters(),
    t: 0,
    over: false,
    reason: '',
    shake: 0,
    banner: '',
    bannerT: 0,
    swapBack: null,
  };

  const targets = [];
  const chosen = SEEDS.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  chosen.forEach((s, i) => targets.push({ id: s.id, need: [14, 11, 9][i], got: 0 }));
  g.targets = targets;

  const at = (c, r) => (g.grid[r] ? g.grid[r][c] : null);

  function newCell(type) {
    return { type: type || pick(SEEDS).id, special: null, id: uid++, fall: 0, pop: 0, spawn: 1 };
  }

  // build a board with no starting matches
  for (let r = 0; r < ROWS; r++) {
    g.grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      let cell;
      let guard = 0;
      do {
        cell = newCell();
        guard++;
      } while (guard < 30 && makesRun(c, r, cell.type));
      g.grid[r][c] = cell;
    }
  }

  function makesRun(c, r, type) {
    const l1 = at(c - 1, r), l2 = at(c - 2, r);
    if (l1 && l2 && l1.type === type && l2.type === type) return true;
    const u1 = at(c, r - 1), u2 = at(c, r - 2);
    if (u1 && u2 && u1.type === type && u2.type === type) return true;
    return false;
  }

  function findMatches() {
    const marks = new Set();
    const runs = [];
    for (let r = 0; r < ROWS; r++) {
      let run = 1;
      for (let c = 1; c <= COLS; c++) {
        const same = c < COLS && at(c, r) && at(c - 1, r) && at(c, r).type === at(c - 1, r).type;
        if (same) run++;
        else {
          if (run >= 3) { const cells = []; for (let k = c - run; k < c; k++) { marks.add(`${k},${r}`); cells.push([k, r]); } runs.push({ cells, len: run, dir: 'h' }); }
          run = 1;
        }
      }
    }
    for (let c = 0; c < COLS; c++) {
      let run = 1;
      for (let r = 1; r <= ROWS; r++) {
        const same = r < ROWS && at(c, r) && at(c, r - 1) && at(c, r).type === at(c, r - 1).type;
        if (same) run++;
        else {
          if (run >= 3) { const cells = []; for (let k = r - run; k < r; k++) { marks.add(`${c},${k}`); cells.push([c, k]); } runs.push({ cells, len: run, dir: 'v' }); }
          run = 1;
        }
      }
    }
    return { marks, runs };
  }

  function trigger(c, r, out) {
    const cell = at(c, r);
    if (!cell || !cell.special) return;
    const sp = cell.special;
    cell.special = null;
    if (sp === 'row') for (let k = 0; k < COLS; k++) out.add(`${k},${r}`);
    if (sp === 'col') for (let k = 0; k < ROWS; k++) out.add(`${c},${k}`);
    if (sp === 'super') {
      const type = cell.type;
      for (let rr2 = 0; rr2 < ROWS; rr2++) for (let cc = 0; cc < COLS; cc++) if (at(cc, rr2) && at(cc, rr2).type === type) out.add(`${cc},${rr2}`);
    }
    g.shake = 0.25;
  }

  function resolve() {
    const { marks, runs } = findMatches();
    if (!marks.size) return false;

    g.cascade += 1;
    g.bestCascade = Math.max(g.bestCascade, g.cascade);

    // specials created by long runs
    const upgrades = [];
    for (const run of runs) {
      if (run.len === 4) upgrades.push({ cell: run.cells[Math.floor(run.len / 2)], special: run.dir === 'h' ? 'col' : 'row' });
      if (run.len >= 5) upgrades.push({ cell: run.cells[Math.floor(run.len / 2)], special: 'super' });
    }

    const all = new Set(marks);
    for (const k of marks) {
      const [c, r] = k.split(',').map(Number);
      trigger(c, r, all);
    }

    const mult = Math.min(5, g.cascade);
    let gained = 0;
    for (const k of all) {
      const [c, r] = k.split(',').map(Number);
      const cell = at(c, r);
      if (!cell) continue;
      const keep = upgrades.find((u) => u.cell[0] === c && u.cell[1] === r);
      if (keep) continue;
      const seed = byId(cell.type);
      g.fx.burst(OX + c * CELL + CELL / 2, OY + r * CELL + CELL / 2, seed.color, 8, 110, 0.45);
      const tgt = g.targets.find((t) => t.id === cell.type);
      if (tgt && tgt.got < tgt.need) {
        tgt.got += 1;
        if (tgt.got === tgt.need) {
          g.score += 350;
          g.banner = `${byId(tgt.id).name} germinated`; g.bannerT = 1.8;
        }
      }
      g.grid[r][c] = null;
      g.cleared += 1;
      gained += 30 * mult;
    }
    for (const u of upgrades) {
      const cell = at(u.cell[0], u.cell[1]);
      if (cell) { cell.special = u.special; cell.pop = 0.3; }
    }
    g.score += gained;
    if (mult >= 2) {
      g.floats.add(VW / 2, OY - 16, `cascade ×${mult}`, PALETTE.pollen, 18);
      g.score += 40 * mult;
    }
    return true;
  }

  function gravity() {
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (g.grid[r][c]) {
          if (write !== r) {
            g.grid[write][c] = g.grid[r][c];
            g.grid[write][c].fall = (write - r) * CELL;
            g.grid[r][c] = null;
          }
          write--;
        }
      }
      for (let r = write; r >= 0; r--) {
        g.grid[r][c] = newCell();
        g.grid[r][c].fall = (write + 1 - r) * CELL + CELL;
      }
    }
  }

  function trySwap(a, b) {
    const A = at(a.c, a.r), B = at(b.c, b.r);
    if (!A || !B) return;
    g.grid[a.r][a.c] = B; g.grid[b.r][b.c] = A;

    // a super seed swapped onto anything detonates immediately
    const specialHit = A.special === 'super' || B.special === 'super';
    const { marks } = findMatches();
    if (!marks.size && !specialHit) {
      g.grid[a.r][a.c] = A; g.grid[b.r][b.c] = B;
      g.swapBack = 0.2;
      g.banner = 'No match there'; g.bannerT = 0.9;
      return;
    }
    if (specialHit && !marks.size) {
      const sup = A.special === 'super' ? { c: b.c, r: b.r } : { c: a.c, r: a.r };
      const other = A.special === 'super' ? A : B;
      const out = new Set();
      other.type = (A.special === 'super' ? B : A).type;
      trigger(sup.c, sup.r, out);
      for (const k of out) { const [c, r] = k.split(',').map(Number); if (g.grid[r][c]) { g.grid[r][c] = null; g.cleared++; g.score += 40; } }
    }
    g.moves -= 1;
    g.cascade = 0;
    g.phase = 'resolve';
    g.timer = 0.05;
  }

  g.update = (dt) => {
    g.t += dt;
    g.shake = Math.max(0, g.shake - dt);
    g.bannerT = Math.max(0, g.bannerT - dt);
    if (g.swapBack !== null && g.swapBack > 0) { g.swapBack -= dt; if (g.swapBack <= 0) g.swapBack = null; }
    g.fx.update(dt, 90);
    g.floats.update(dt);

    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const cell = at(c, r);
      if (!cell) continue;
      if (cell.fall > 0) cell.fall = Math.max(0, cell.fall - 900 * dt);
      if (cell.pop > 0) cell.pop = Math.max(0, cell.pop - dt * 2.2);
      if (cell.spawn > 0) cell.spawn = Math.max(0, cell.spawn - dt * 4);
    }

    if (g.phase === 'resolve') {
      g.timer -= dt;
      if (g.timer <= 0) {
        const did = resolve();
        gravity();
        if (did) { g.timer = 0.24; }
        else {
          g.phase = 'idle';
          if (g.targets.every((t) => t.got >= t.need)) {
            g.score += g.moves * 60;
            g.over = true; g.reason = 'Every seed in the tray germinated.';
          } else if (g.moves <= 0) {
            g.over = true; g.reason = 'Out of moves.';
          }
        }
      }
    }
  };

  g.input = (input) => {
    if (g.phase !== 'idle' || g.over) return;
    const p = input.pointer;
    const c = Math.floor((p.x - OX) / CELL), r = Math.floor((p.y - OY) / CELL);
    const inside = c >= 0 && r >= 0 && c < COLS && r < ROWS;

    const adjacent = (a) => Math.abs(a.c - c) + Math.abs(a.r - r) === 1;

    // Tap-tap or drag, both end in the same place.
    if (p.justDown) {
      if (!inside) { g.sel = null; return; }
      if (g.sel && adjacent(g.sel)) { const from = g.sel; g.sel = null; trySwap(from, { c, r }); }
      else g.sel = { c, r };
      return;
    }
    if (p.down && inside && g.sel && adjacent(g.sel)) {
      const from = g.sel; g.sel = null;
      trySwap(from, { c, r });
    }
  };

  g.draw = (ctx) => {
    ctx.save();
    if (g.shake > 0) ctx.translate((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5);

    const bg = ctx.createLinearGradient(0, 0, 0, VH);
    bg.addColorStop(0, '#22392C');
    bg.addColorStop(1, PALETTE.ink);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);

    // germination tray objectives
    text(ctx, 'GERMINATION TRAY', VW / 2, 72, { size: 12, color: 'rgba(234,242,226,0.55)', align: 'center', font: 'Karla, sans-serif', weight: 700 });
    g.targets.forEach((t, i) => {
      const w = 142, x = 12 + i * (w + 9), y = 84;
      const done = t.got >= t.need;
      ctx.fillStyle = 'rgba(18,33,26,0.7)';
      rr(ctx, x, y, w, 62, 12); ctx.fill();
      ctx.strokeStyle = done ? PALETTE.chloro : 'rgba(139,224,106,0.2)';
      ctx.lineWidth = 2; rr(ctx, x, y, w, 62, 12); ctx.stroke();
      drawSeed(ctx, x + 26, y + 26, byId(t.id), null, g.t, 0.72);
      text(ctx, `${Math.min(t.got, t.need)}/${t.need}`, x + 52, y + 26, { size: 17, color: done ? PALETTE.chloro : PALETTE.paper });
      text(ctx, byId(t.id).name, x + 52, y + 42, { size: 10, color: 'rgba(234,242,226,0.55)', font: 'Karla, sans-serif', weight: 600 });
      const bw = w - 20;
      ctx.fillStyle = 'rgba(234,242,226,0.12)';
      rr(ctx, x + 10, y + 50, bw, 6, 3); ctx.fill();
      ctx.fillStyle = done ? PALETTE.chloro : byId(t.id).color;
      rr(ctx, x + 10, y + 50, Math.max(3, bw * Math.min(1, t.got / t.need)), 6, 3); ctx.fill();
    });

    // board
    ctx.fillStyle = 'rgba(18,33,26,0.55)';
    rr(ctx, OX - 6, OY - 6, COLS * CELL + 12, ROWS * CELL + 12, 16); ctx.fill();

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = at(c, r);
        const x = OX + c * CELL + CELL / 2;
        const y = OY + r * CELL + CELL / 2;
        ctx.fillStyle = (c + r) % 2 ? 'rgba(139,224,106,0.045)' : 'rgba(139,224,106,0.08)';
        rr(ctx, OX + c * CELL + 2, OY + r * CELL + 2, CELL - 4, CELL - 4, 10); ctx.fill();
        if (!cell) continue;
        const sel = g.sel && g.sel.c === c && g.sel.r === r;
        const scale = 0.86 + cell.pop * 0.3 + (sel ? 0.12 + Math.sin(g.t * 9) * 0.04 : 0) - cell.spawn * 0.3;
        drawSeed(ctx, x, y - cell.fall, byId(cell.type), cell.special, g.t + c + r, scale);
        if (sel) {
          ctx.strokeStyle = PALETTE.paper; ctx.lineWidth = 2.5;
          rr(ctx, OX + c * CELL + 3, OY + r * CELL + 3, CELL - 6, CELL - 6, 10); ctx.stroke();
        }
      }
    }

    // soil line + sprouts earned
    ctx.fillStyle = '#3A2A1E';
    ctx.fillRect(0, VH - 66, VW, 66);
    ctx.fillStyle = 'rgba(139,224,106,0.18)';
    ctx.fillRect(0, VH - 66, VW, 3);
    const sprouts = Math.min(22, Math.floor(g.cleared / 4));
    for (let i = 0; i < sprouts; i++) {
      const x = 16 + i * 21;
      const h = 12 + (i % 3) * 5;
      ctx.strokeStyle = PALETTE.chloroDk; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(x, VH - 12); ctx.lineTo(x + Math.sin(g.t + i) * 2, VH - 12 - h); ctx.stroke();
      ctx.fillStyle = PALETTE.chloro;
      ctx.beginPath(); ctx.ellipse(x - 5, VH - 12 - h, 6, 3.4, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 5, VH - 14 - h, 6, 3.4, 0.5, 0, Math.PI * 2); ctx.fill();
    }

    g.fx.draw(ctx);
    g.floats.draw(ctx);
    ctx.restore();

    hudBar(ctx, { score: g.score, label: 'MATCH AND GERMINATE', right: `${g.moves} moves` });
    if (g.bannerT > 0) {
      ctx.globalAlpha = Math.min(1, g.bannerT);
      text(ctx, g.banner, VW / 2, OY - 22, { size: 17, color: PALETTE.chloro, align: 'center' });
      ctx.globalAlpha = 1;
    }
  };

  g.result = () => ({
    score: g.score,
    sun: Math.max(1, Math.floor(g.score * SUN_RATE.seeds)),
    reason: g.reason,
    stats: [
      ['Seeds cleared', g.cleared],
      ['Best cascade', `×${g.bestCascade}`],
      ['Trays completed', `${g.targets.filter((t) => t.got >= t.need).length} / 3`],
    ],
    lesson: 'A seed germinates with water, oxygen and warmth. Light is optional — plenty of seeds sprout in the dark.',
  });

  return g;
}

function drawSeed(ctx, x, y, seed, special, t, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  if (special) {
    ctx.strokeStyle = special === 'super' ? PALETTE.paper : PALETTE.pollen;
    ctx.lineWidth = 3;
    circle(ctx, 0, 0, 25 + Math.sin(t * 6) * 1.5); ctx.stroke();
  }

  ctx.fillStyle = seed.color;
  if (seed.id === 'sunflower') {
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 17, 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(18,33,26,0.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(5, 10); ctx.stroke();
  } else if (seed.id === 'bean') {
    ctx.beginPath();
    ctx.moveTo(-13, -4); ctx.quadraticCurveTo(0, -20, 13, -4);
    ctx.quadraticCurveTo(16, 12, 0, 15); ctx.quadraticCurveTo(-16, 12, -13, -4);
    ctx.fill();
  } else if (seed.id === 'pumpkin') {
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(18,33,26,0.35)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 11, 0, 0, Math.PI * 2); ctx.stroke();
  } else if (seed.id === 'corn') {
    ctx.beginPath();
    ctx.moveTo(0, -16); ctx.quadraticCurveTo(15, -4, 10, 14);
    ctx.lineTo(-10, 14); ctx.quadraticCurveTo(-15, -4, 0, -16);
    ctx.fill();
  } else if (seed.id === 'apple') {
    circle(ctx, 0, 2, 14); ctx.fill();
    ctx.strokeStyle = '#5FB544'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -11); ctx.quadraticCurveTo(6, -19, 12, -17); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(0, 4, 11, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6E4629';
    ctx.beginPath(); ctx.ellipse(0, -9, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-1.5, -18, 3, 6);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  circle(ctx, -4, -6, 3.4); ctx.fill();
  ctx.restore();
}
return createSeedCrush;
})();

/* ===== js/games/plant-survivors.js ===== */
const createPlantSurvivors = (() => {
// plant-survivors.js — Survivor-like. You do not attack; your thorns fire themselves.
// Your job is positioning: the pests are not hunting you, they are hunting the three plants.
// Every upgrade on offer is a real plant defence strategy.



const TOP = 46;
const SURVIVE = 120;

const PESTS = {
  caterpillar: { hp: 26, speed: 34, dmg: 5,  r: 13, xp: 2, color: '#A8D46A' },
  beetle:      { hp: 18, speed: 68, dmg: 4,  r: 11, xp: 3, color: '#C97B3A' },
  spider:      { hp: 30, speed: 44, dmg: 7,  r: 13, xp: 4, color: '#7B6FA8' },
  fungus:      { hp: 22, speed: 26, dmg: 8,  r: 14, xp: 3, color: '#C79BE8' },
};

const UPGRADES = [
  { id: 'rate',   name: 'Faster thorns',   desc: 'Thorns fire 18% more often.',            bio: 'Constant low-level defence is cheaper than one big response.' },
  { id: 'count',  name: 'More thorns',     desc: 'One extra thorn per volley.',            bio: 'Prickles are skin outgrowths — plants make them by the thousand.' },
  { id: 'dmg',    name: 'Sharper thorns',  desc: 'Thorns hit 30% harder.',                 bio: 'Sharper points mean less energy spent per attacker.' },
  { id: 'speed',  name: 'Quick footing',   desc: 'You move 15% faster.',                   bio: 'Getting between pest and plant beats out-damaging it.' },
  { id: 'nova',   name: 'Pollen nova',     desc: 'A pollen burst pushes pests back.',      bio: 'Some plants release irritant powders when disturbed.' },
  { id: 'bark',   name: 'Thicker bark',    desc: 'Plants take 25% less damage.',           bio: 'Bark is dead corky armour over the living phloem.' },
  { id: 'heal',   name: 'Root recovery',   desc: 'Plants slowly regrow health.',           bio: 'Stored root sugar lets a chewed plant rebuild leaves.' },
  { id: 'magnet', name: 'Wider roots',     desc: 'Collect pollen from further away.',      bio: 'Root systems usually spread wider than the canopy above.' },
];

function createPlantSurvivors() {
  const g = {
    p: { x: VW / 2, y: 470, r: 13, hp: 5, inv: 0 },
    plants: [
      { x: 100, y: 250, hp: 170, max: 170, sp: 'sunflower' },
      { x: 240, y: 170, hp: 170, max: 170, sp: 'rose' },
      { x: 380, y: 250, hp: 170, max: 170, sp: 'oak' },
    ],
    pests: [],
    thorns: [],
    orbs: [],
    drops: [],
    fx: new Particles(),
    floats: new Floaters(),
    time: 0,
    score: 0,
    kills: 0,
    level: 1,
    xp: 0,
    xpNeed: 6,
    fireT: 0,
    rate: 0.62,
    count: 1,
    dmg: 11,
    moveSpeed: 165,
    magnet: 70,
    barkRes: 0,
    healRate: 0,
    novaT: 0,
    novaEvery: 0,
    spawnT: 2.6,
    dblT: 0,
    invT: 0,
    choosing: null,
    over: false,
    reason: '',
    t: 0,
    shake: 0,
    banner: '',
    bannerT: 0,
  };

  const alive = () => g.plants.filter((p) => p.hp > 0);

  function spawnPest() {
    const wave = 1 + g.time / 26;
    const pool = g.time < 25 ? ['caterpillar'] : g.time < 55 ? ['caterpillar', 'beetle'] : g.time < 95 ? ['caterpillar', 'beetle', 'spider'] : Object.keys(PESTS);
    const type = pick(pool);
    const base = PESTS[type];
    const edge = Math.floor(rand(0, 4));
    let x, y;
    if (edge === 0) { x = rand(0, VW); y = TOP - 20; }
    else if (edge === 1) { x = rand(0, VW); y = VH + 20; }
    else if (edge === 2) { x = -20; y = rand(TOP, VH); }
    else { x = VW + 20; y = rand(TOP, VH); }
    g.pests.push({
      type, x, y,
      hp: base.hp * (1 + wave * 0.13),
      max: base.hp * (1 + wave * 0.13),
      speed: base.speed * (1 + wave * 0.038),
      r: base.r, flash: 0, t: rand(0, 6),
    });
  }

  function damagePest(pest, amount, fromX, fromY) {
    pest.hp -= amount;
    pest.flash = 0.12;
    if (pest.hp <= 0) {
      g.pests = g.pests.filter((p) => p !== pest);
      g.kills += 1;
      g.score += 12;
      g.fx.burst(pest.x, pest.y, PESTS[pest.type].color, 12, 130, 0.5);
      g.orbs.push({ x: pest.x, y: pest.y, v: PESTS[pest.type].xp, t: 0 });
      if (pest.type === 'fungus' && !pest.split) {
        for (let i = 0; i < 2; i++) {
          g.pests.push({ type: 'fungus', x: pest.x + rand(-14, 14), y: pest.y + rand(-14, 14), hp: 10, max: 10, speed: 40, r: 9, flash: 0, t: 0, split: true });
        }
      }
      if (Math.random() < 0.055) {
        g.drops.push({ x: pest.x, y: pest.y, type: pick(['supersun', 'waterdrop', 'barkshield', 'superbloom', 'butterfly']), life: 12 });
      }
    }
  }

  function fire() {
    if (!g.pests.length) return;
    const sorted = g.pests.slice().sort((a, b) => Math.hypot(a.x - g.p.x, a.y - g.p.y) - Math.hypot(b.x - g.p.x, b.y - g.p.y));
    for (let i = 0; i < g.count; i++) {
      const target = sorted[Math.min(i, sorted.length - 1)];
      const a = Math.atan2(target.y - g.p.y, target.x - g.p.x) + (i > 0 ? rand(-0.12, 0.12) : 0);
      g.thorns.push({ x: g.p.x, y: g.p.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, life: 1.5 });
    }
  }

  function levelUp() {
    g.level += 1;
    g.xp -= g.xpNeed;
    g.xpNeed = Math.round(g.xpNeed * 1.42 + 2);
    const pool = UPGRADES.slice().sort(() => Math.random() - 0.5).slice(0, 3);
    g.choosing = pool;
  }

  function apply(u) {
    if (u.id === 'rate') g.rate *= 0.82;
    if (u.id === 'count') g.count += 1;
    if (u.id === 'dmg') g.dmg *= 1.3;
    if (u.id === 'speed') g.moveSpeed *= 1.15;
    if (u.id === 'nova') { g.novaEvery = g.novaEvery ? g.novaEvery * 0.75 : 5; }
    if (u.id === 'bark') g.barkRes = Math.min(0.7, g.barkRes + 0.25);
    if (u.id === 'heal') g.healRate += 1.6;
    if (u.id === 'magnet') g.magnet += 55;
    g.choosing = null;
    g.banner = u.name; g.bannerT = 1.6;
  }

  function takeDrop(d) {
    const c = { supersun: PALETTE.pollen, waterdrop: PALETTE.rain, barkshield: PALETTE.barkLt, superbloom: PALETTE.petal, butterfly: '#FF9F45' }[d.type];
    g.fx.burst(d.x, d.y, c, 22, 180);
    if (d.type === 'supersun') { g.dblT = 8; g.banner = 'Super Sun — double damage'; }
    if (d.type === 'waterdrop') { g.plants.forEach((p) => { if (p.hp > 0) p.hp = Math.min(p.max, p.hp + 30); }); g.banner = 'Water Drop — plants recover'; }
    if (d.type === 'barkshield') { g.invT = 7; g.banner = 'Bark Shield — you are armoured'; }
    if (d.type === 'superbloom') {
      g.pests.forEach((p) => damagePest(p, 45, g.p.x, g.p.y));
      g.fx.burst(g.p.x, g.p.y, PALETTE.petal, 50, 300, 1.0);
      g.banner = 'Super Bloom';
    }
    if (d.type === 'butterfly') { g.orbs.forEach((o) => (o.pull = true)); g.banner = 'Butterfly — pollen drawn in'; }
    g.bannerT = 1.6;
  }

  g.update = (dt) => {
    if (g.choosing) { g.t += dt; return; }
    g.t += dt;
    g.time += dt;
    g.shake = Math.max(0, g.shake - dt);
    g.bannerT = Math.max(0, g.bannerT - dt);
    g.p.inv = Math.max(0, g.p.inv - dt);
    g.dblT = Math.max(0, g.dblT - dt);
    g.invT = Math.max(0, g.invT - dt);
    g.fx.update(dt, 0);
    g.floats.update(dt);
    g.score += dt * 6;

    if (g.healRate) g.plants.forEach((p) => { if (p.hp > 0) p.hp = Math.min(p.max, p.hp + g.healRate * dt); });

    if (g.spawnT <= 0) {

    }

    g.fireT -= dt;

    if (g.novaEvery) {

      if (g.novaT <= 0) {

        g.fx.burst(g.p.x, g.p.y, PALETTE.pollen, 26, 220, 0.6);
        for (const p of g.pests) {
          const d = Math.hypot(p.x - g.p.x, p.y - g.p.y);
          if (d < 110) {
            const a = Math.atan2(p.y - g.p.y, p.x - g.p.x);

          }

      }
    }

      th.x += th.vx * dt; th.y += th.vy * dt; th.life -= dt;
      if (th.life <= 0 || th.x < -20 || th.x > VW + 20 || th.y < TOP - 20 || th.y > VH + 20) { g.thorns.splice(i, 1); continue; }

      if (living.length) {
        let best = living[0], bd = 1e9;
        for (const pl of living) {
          const d = Math.hypot(pl.x - p.x, pl.y - p.y);
          if (d < bd) { bd = d; best = pl; }
        }
        tx = best.x; ty = best.y;
        if (bd < 34) {

          if (best.hp <= 0) {
            best.hp = 0;
            g.shake = 0.5;
            g.floats.add(best.x, best.y - 40, 'plant lost', PALETTE.danger, 17);
            g.fx.burst(best.x, best.y, PALETTE.danger, 30, 200);
          }
          continue;
        }
      }
      const a = Math.atan2(ty - p.y, tx - p.x);
      p.x += Math.cos(a) * p.speed * dt;
      p.y += Math.sin(a) * p.speed * dt;

      if (g.p.inv <= 0 && g.invT <= 0 && Math.hypot(p.x - g.p.x, p.y - g.p.y) < p.r + g.p.r) {
        g.p.hp -= 1;
        g.p.inv = 1.1;
        g.shake = 0.35;
        g.fx.burst(g.p.x, g.p.y, PALETTE.danger, 16, 150);
        if (g.p.hp <= 0) { g.over = true; g.reason = 'The gardener was overrun.'; }

    }

    for (let i = g.orbs.length - 1; i >= 0; i--) {

    }

        continue;
      }

      ctx.fillStyle = 'rgba(18,33,26,0.5)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 30, 34, 10, 0, 0, Math.PI * 2); ctx.fill();
      drawPlant(ctx, p.x, p.y + 30, 96, p.sp, frac > 0.75 ? 5 : frac > 0.45 ? 4 : frac > 0.2 ? 2 : 1, g.t);
      ctx.fillStyle = 'rgba(18,33,26,0.8)';
      rr(ctx, p.x - 26, p.y + 36, 52, 7, 3.5); ctx.fill();
      ctx.fillStyle = frac > 0.5 ? PALETTE.chloro : frac > 0.25 ? PALETTE.pollen : PALETTE.danger;

    }

      text(ctx, `Level ${g.level}`, VW / 2, 130, { size: 34, color: PALETTE.paper, align: 'center' });
      text(ctx, 'Pick one defence', VW / 2, 158, { size: 15, color: 'rgba(234,242,226,0.6)', align: 'center', font: 'Karla, sans-serif', weight: 600 });
      cardRects().forEach((r, i) => {
        const u = g.choosing[i];
        ctx.fillStyle = '#1E3529';
        rr(ctx, r.x, r.y, r.w, r.h, 16); ctx.fill();
        ctx.strokeStyle = PALETTE.chloro; ctx.lineWidth = 2;
        rr(ctx, r.x, r.y, r.w, r.h, 16); ctx.stroke();
        text(ctx, `${i + 1}`, r.x + 22, r.y + 34, { size: 18, color: PALETTE.pollen });
        text(ctx, u.name, r.x + 46, r.y + 34, { size: 21, color: PALETTE.paper });
        text(ctx, u.desc, r.x + 46, r.y + 58, { size: 14, color: PALETTE.chloro, font: 'Karla, sans-serif', weight: 600 });
        wrapText(ctx, u.bio, r.x + 46, r.y + 80, r.w - 70, 15, { size: 12, color: 'rgba(234,242,226,0.55)', font: 'Karla, sans-serif', weight: 400 });
      });
    }
  };

  g.result = () => ({
    score: Math.floor(g.score),
    sun: Math.max(1, Math.floor(g.score * SUN_RATE.survivors)),
    reason: g.reason,
    stats: [
      ['Pests cleared', g.kills],
      ['Survived', `${Math.floor(g.time)}s of ${SURVIVE}s`],
      ['Plants standing', `${alive().length} / 3`],
    ],
    lesson: 'Real plants defend themselves chemically and structurally — thorns, bitter compounds, thick bark — because they cannot run.',
  });

  return g;
}

function wrapText(ctx, str, x, y, maxW, lh, style) {
  ctx.save();
  ctx.font = `${style.weight || 400} ${style.size}px ${style.font}`;
  ctx.fillStyle = style.color;
  ctx.textAlign = 'left';
  const words = str.split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? `${line} ${w}` : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
  ctx.restore();
}

function drawPest(ctx, p, t) {
  const base = PESTS[p.type];
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = p.flash > 0 ? '#FFFFFF' : base.color;

  if (p.type === 'caterpillar') {
    for (let i = 0; i < 4; i++) {
      circle(ctx, -8 + i * 6, Math.sin(t * 8 + i) * 2, p.r * 0.55); ctx.fill();
    }
    ctx.fillStyle = PALETTE.ink;
    circle(ctx, 10, -1, 1.8); ctx.fill();
  } else if (p.type === 'beetle') {
    ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.78, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(18,33,26,0.65)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -p.r * 0.78); ctx.lineTo(0, p.r * 0.78); ctx.stroke();
  } else if (p.type === 'spider') {
    ctx.strokeStyle = p.flash > 0 ? '#FFF' : base.color;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.sin(t * 6) * 0.1;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * p.r * 1.5, Math.sin(a) * p.r * 1.5); ctx.stroke();
    }
    circle(ctx, 0, 0, p.r * 0.7); ctx.fill();
  } else {
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + t;
      circle(ctx, Math.cos(a) * p.r * 0.45, Math.sin(a) * p.r * 0.45, p.r * 0.5); ctx.fill();
    }
  }

  if (p.hp < p.max) {
    ctx.fillStyle = 'rgba(18,33,26,0.7)';
    rr(ctx, -p.r, -p.r - 9, p.r * 2, 4, 2); ctx.fill();
    ctx.fillStyle = PALETTE.danger;
    rr(ctx, -p.r, -p.r - 9, p.r * 2 * (p.hp / p.max), 4, 2); ctx.fill();
  }
  ctx.restore();
}
return createPlantSurvivors;

    if (!plot.unlocked) {
      gctx.fillStyle = 'rgba(18,33,26,0.5)';
      rr(gctx, x - 70, base - 128, 140, 150, 14); gctx.fill();
      gctx.setLineDash([7, 7]);
      gctx.strokeStyle = 'rgba(234,242,226,0.28)'; gctx.lineWidth = 2;
      rr(gctx, x - 70, base - 128, 140, 150, 14); gctx.stroke();
      gctx.setLineDash([]);
      text(gctx, '✿', x, base - 66, { size: 30, color: 'rgba(234,242,226,0.4)', align: 'center' });
      text(gctx, `${PLOT_UNLOCK_COST[i]} plantus`, x, base - 34, { size: 15, color: PALETTE.petal, align: 'center' });
      text(gctx, 'to open this bed', x, base - 16, { size: 11, color: 'rgba(234,242,226,0.45)', align: 'center', font: 'Karla, sans-serif', weight: 600 });
    } else {
      gctx.fillStyle = 'rgba(0,0,0,0.22)';
      gctx.beginPath(); gctx.ellipse(x, base + 6, 46, 10, 0, 0, Math.PI * 2); gctx.fill();
      drawPlant(gctx, x, base, 214, plot.species, plot.stage, gt + i);

      if (plot.stage === MAX_STAGE) {
        for (let k = 0; k < 3; k++) {
          const px = x + Math.sin(gt * 0.9 + k * 2.1) * 52;
          const py = base - 150 + Math.cos(gt * 1.3 + k) * 26;
          gctx.fillStyle = 'rgba(255,201,60,0.75)';
          circle(gctx, px, py, 2.6); gctx.fill();
        }
      }
    }

    // label plate
    const label = plot.unlocked ? sp.name : 'Locked bed';
    gctx.fillStyle = 'rgba(18,33,26,0.72)';
    const w = 152;
    rr(gctx, x - w / 2, GH - 40, w, 28, 14); gctx.fill();
    text(gctx, label, x, GH - 26, { size: 14, color: plot.unlocked ? PALETTE.paper : 'rgba(234,242,226,0.5)', align: 'center' });
    text(gctx, plot.unlocked ? `${plot.stage}/${MAX_STAGE}` : '', x + w / 2 - 16, GH - 26, { size: 12, color: PALETTE.chloro, align: 'center' });
  });

  requestAnimationFrame(drawGarden);
}
requestAnimationFrame(drawGarden);

gc.addEventListener('click', (e) => {
  const r = gc.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * GW;
  let best = 0, bd = 1e9;
  S.state.plots.forEach((_, i) => {
    const d = Math.abs(plotX(i) - x);
    if (d < bd) { bd = d; best = i; }
  });
  selectPlot(best);
});

/* =========================================================
   Plot panel
   ========================================================= */
function selectPlot(i) {
  selected = i;
  renderPlot();
  $('plotPanel').hidden = false;
  $('plotPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderPlot() {
  if (selected === null) return;
  const plot = S.state.plots[selected];
  const sp = SPECIES[plot.species];
  const locked = !plot.unlocked;

  $('plotName').textContent = locked ? 'Locked bed' : sp.name;
  $('plotLatin').textContent = locked ? `Opens as ${sp.name}` : sp.latin;
  $('plotStage').textContent = locked ? 'Closed' : STAGES[plot.stage].name;

  const track = $('stageTrack');
  track.innerHTML = '';
  STAGES.forEach((_, k) => {
    const s = document.createElement('span');
    if (!locked && k < plot.stage) s.className = 'on';
    if (!locked && k === plot.stage) s.className = 'now';
    track.appendChild(s);
  });

  $('plotCaption').textContent = locked
    ? `This bed is waiting. Plantus tokens are minted by growing what you already have — bring ${PLOT_UNLOCK_COST[selected]} back here and the ${sp.name.toLowerCase()} goes in.`
    : STAGES[plot.stage].caption;
  $('plotTrait').textContent = locked ? '' : sp.trait;

  const btn = $('growBtn');
  if (locked) {
    const c = PLOT_UNLOCK_COST[selected];
    btn.textContent = `Open bed — ${c} plantus`;
    btn.disabled = S.state.plantus < c;
    btn.onclick = () => {
      if (S.unlockPlot(selected)) { bump('plantusCount'); renderPlot(); }
    };
  } else if (plot.stage >= MAX_STAGE) {
    btn.textContent = 'Fully bloomed';
    btn.disabled = true;
    btn.onclick = null;
  } else {
    const c = S.growthCost(selected);
    btn.textContent = `Grow to ${STAGES[plot.stage + 1].name.toLowerCase()} — ${c} sun`;
    btn.disabled = S.state.sun < c;
    btn.onclick = () => doGrow(selected);
  }
}

function doGrow(i) {
  const res = S.grow(i);
  if (!res) return;
  bump('sunCount'); bump('plantusCount');
  renderPlot();

  const stage = STAGES[res.stage];
  const fact = res.factId ? FACTS[res.factId] : null;
  showSheet(`
    <h2>${stage.name}</h2>
    <p class="reason">${SPECIES[S.state.plots[i].species].name} · ${res.spent} sun spent</p>
    <div class="score-row">
      <span class="big" style="color:var(--petal)">+${res.plantus}</span>
      <span class="earn" style="background:rgba(255,126,168,.16);color:var(--petal)">plantus earned</span>
    </div>
    <div class="lesson"><strong>What just happened</strong>${stage.caption}</div>
    ${fact ? `<div class="unlock"><span class="ico">📖</span><div><h4>Field guide: ${fact.title}</h4><p>${fact.body}</p></div></div>` : ''}
    <div class="sheet-actions">
      <button class="btn btn--full" data-close>Back to the garden</button>
    </div>
  `);
}

$('closePlot').onclick = () => { $('plotPanel').hidden = true; selected = null; };

/* =========================================================
   Wallet + field guide
   ========================================================= */
function bump(id) {
  const el = $(id).parentElement;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 220);
}

function renderWallet() {
  $('sunCount').textContent = S.state.sun;
  $('plantusCount').textContent = S.state.plantus;
  // contextual hint under the bed
  const next = S.state.plots
    .map((p, i) => ({ i, p, c: S.growthCost(i) }))
    .filter((o) => o.p.unlocked && o.c !== null)
    .sort((a, b) => a.c - b.c)[0];
  $('bedHint').textContent = next
    ? (S.state.sun >= next.c
        ? `You can afford to grow the ${SPECIES[next.p.species].name.toLowerCase()} now — tap its plot`
        : `Tap a plot to tend it · cheapest growth costs ${next.c} sun, you have ${S.state.sun}`)
    : 'Every open bed is in full bloom — spend plantus to open another';

  const t = S.state.totals;
  $('statLine').textContent =
    `${t.sunEarned} sun earned all-time · ${t.blooms} full blooms · quiz ${t.quizRight}/${t.quizAsked}`;
}

function renderFacts() {
  const grid = $('factGrid');
  grid.innerHTML = '';
  const ids = Object.keys(FACTS);
  $('factCount').textContent = S.state.facts.length;
  $('factTotal').textContent = ids.length;
  ids.forEach((id) => {
    const f = FACTS[id];
    const has = S.state.facts.includes(id);
    const el = document.createElement('article');
    el.className = `fact${has ? '' : ' locked'}`;
    el.innerHTML = has
      ? `<span class="tag">${f.tag}</span><h4>${f.title}</h4><p>${f.body}</p>`
      : `<span class="tag">${f.tag}</span><h4>Not collected</h4><p>Keep playing and growing to unlock this entry.</p>`;
    grid.appendChild(el);
  });
}

function renderGames() {
  const grid = $('gameGrid');
  grid.innerHTML = '';
  GAMES.forEach((g) => {
    const btn = document.createElement('button');
    btn.className = 'game-card';
    const best = S.state.best[g.id];
    btn.innerHTML = `
      <span class="glyph" aria-hidden="true">${GLYPH[g.id]}</span>
      <span class="tag">${g.tag}</span>
      <h3>${g.title}</h3>
      <p class="verb">${g.verb}</p>
      <p class="best">${best ? `Best ${best}` : 'Not played yet'}</p>`;
    btn.onclick = () => startRun(g.id);
    grid.appendChild(btn);
  });
}

function renderAll() {
  renderWallet();
  renderFacts();
  renderGames();
  if (selected !== null) renderPlot();
}
S.onChange(renderAll);
renderAll();

/* =========================================================
   Running a game
   ========================================================= */
const gameCanvas = $('gameCanvas');
const gameCtx = setupCanvas(gameCanvas);

function startRun(id) {
  const meta = GAMES.find((g) => g.id === id);
  $('playTitle').textContent = meta.title;
  $('playHint').textContent = meta.hint;
  hub.hidden = true;
  play.hidden = false;
  document.body.classList.add('playing');
  window.scrollTo(0, 0);

  const game = FACTORIES[id]();
  runInput = new Input(gameCanvas);

  const wrapped = {
    update(dt) { game.input(runInput); game.update(dt); },
    draw(ctx) { game.draw(ctx); },
    get over() { return game.over; },
    result: () => game.result(),
  };

  stopRun = runLoop(wrapped, gameCtx, runInput, (res) => finishRun(id, res));
}

function endRunCleanup() {
  if (stopRun) { stopRun(); stopRun = null; }
  if (runInput) { runInput.destroy(); runInput = null; }
  play.hidden = true;
  hub.hidden = false;
  document.body.classList.remove('playing');
}

$('quitBtn').onclick = () => endRunCleanup();
$('homeBtn').onclick = () => { if (!play.hidden) endRunCleanup(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

function finishRun(id, res) {
  const rec = S.recordRun(id, res.score, res.sun);
  endRunCleanup();

  const q = pickQuiz(id);
  const fact = rec.newFact ? FACTS[rec.newFact] : null;

  showSheet(`
    <h2>${GAMES.find((g) => g.id === id).title}</h2>
    <p class="reason">${res.reason}</p>
    <div class="score-row">
      <span class="big">${res.score}</span>
      <span class="earn">+${res.sun} sun</span>
    </div>
    <ul class="stat-list">
      ${res.stats.map(([k, v]) => `<li><span>${k}</span><b>${v}</b></li>`).join('')}
      <li><span>Personal best</span><b>${rec.best}</b></li>
    </ul>
    <div class="lesson"><strong>The biology</strong>${res.lesson}</div>
    ${fact ? `<div class="unlock"><span class="ico">📖</span><div><h4>Field guide: ${fact.title}</h4><p>${fact.body}</p></div></div>` : ''}
    <div class="quiz" id="quizBox">
      <p>${q.q}</p>
      <div class="quiz-opts">
        ${q.a.map((opt, i) => `<button class="quiz-opt" data-i="${i}">${opt}</button>`).join('')}
      </div>
      <p class="quiz-feedback" id="quizFeedback">Answer correctly for +15 sun.</p>
    </div>
    <div class="sheet-actions">
      <button class="btn btn--full" data-again="${id}">Play again</button>
      <button class="btn btn--ghost btn--full" data-close>Spend sun in the garden</button>
    </div>
  `);

  let answered = false;
  sheet.querySelectorAll('.quiz-opt').forEach((btn) => {
    btn.onclick = () => {
      if (answered) return;
      answered = true;
      const i = Number(btn.dataset.i);
      const right = i === q.correct;
      btn.classList.add(right ? 'right' : 'wrong');
      if (!right) sheet.querySelector(`.quiz-opt[data-i="${q.correct}"]`).classList.add('right');
      S.recordQuiz(right);
      if (right) { S.addSun(15); bump('sunCount'); }
      $('quizFeedback').textContent = right ? `Correct. +15 sun. ${q.why}` : q.why;
    };
  });
}

/* =========================================================
   Sheet plumbing
   ========================================================= */
function showSheet(html) {
  sheet.innerHTML = html;
  overlay.hidden = false;
  overlay.style.display = 'grid';
  sheet.querySelectorAll('[data-close]').forEach((b) => (b.onclick = closeSheet));
  sheet.querySelectorAll('[data-again]').forEach((b) => (b.onclick = () => { closeSheet(); startRun(b.dataset.again); }));
  sheet.querySelector('button')?.focus();
}
function closeSheet() {
  overlay.hidden = true;
  // Do not rely on [hidden] alone: a cached stylesheet that sets display on
  // .overlay would leave an empty sheet floating over the page.
  overlay.style.display = 'none';
  sheet.innerHTML = '';
}
closeSheet();  // make sure nothing is stranded on first paint
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closeSheet(); });

$('resetBtn').onclick = () => {
  showSheet(`
    <h2>Clear your save?</h2>
    <p class="reason">Every plant, token and field guide entry goes back to the start. This cannot be undone.</p>
    <div class="sheet-actions">
      <button class="btn btn--full" style="background:var(--danger);color:#fff" id="confirmReset">Clear it</button>
      <button class="btn btn--ghost btn--full" data-close>Keep my garden</button>
    </div>`);
  $('confirmReset').onclick = () => { S.reset(); selected = null; $('plotPanel').hidden = true; closeSheet(); };
};


/* =========================================================
   Boot screen and distraction-free play
   ========================================================= */

// Fullscreen can only be requested from a real user gesture, which is what the
// Play button is for. iOS Safari has no Fullscreen API on iPhone, so the PWA
// manifest covers that case instead ("Add to Home Screen").
function goFullscreen() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (fn) { try { fn.call(el, { navigationUI: 'hide' }); } catch { fn.call(el); } }
}
function exitFullscreen() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen;
  if (fn && (document.fullscreenElement || document.webkitFullscreenElement)) {
    try { fn.call(document); } catch { /* already out */ }
  }
}

const boot = $('boot');
function dismissBoot() {
  boot.style.opacity = '0';
  boot.style.transition = 'opacity .25s ease';
  setTimeout(() => { boot.hidden = true; boot.style.display = 'none'; }, 250);
  document.querySelector('.games')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.querySelector('.boot-inner p').textContent = `Five games. One garden. \u00b7 ${BUILD}`;
$('bootPlay').onclick = () => { goFullscreen(); dismissBoot(); };
$('bootWindowed').onclick = () => dismissBoot();

// Keep the canvas crisp when the viewport changes (rotation, fullscreen toggle).
window.addEventListener('resize', () => {
  if (!play.hidden) gameCanvas.getBoundingClientRect();
});
})();
</script>
