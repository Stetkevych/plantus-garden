name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: api unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the AWS SDK the Lambda runtime provides
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Parse and normalise model output
        working-directory: backend
        run: npm test
      - name: Check the single-file build still assembles
        run: node build/build-single-file.mjs
      - name: Unity data converts cleanly and is up to date
        run: node tools/unity-to-js.mjs && git diff --exit-code lab/plants.js
      - name: Lab rules (growing table, unlocks, combat)
        run: node test/lab.test.mjs

  smoke:
    name: crash harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run every game headlessly with random input
        run: node test/smoke.mjs

  balance:
    name: difficulty and payout harness
    runs-on: ubuntu-latest
    # Bot play is slow — it is the check that actually catches unplayable tuning,
    # so give it room rather than trimming the run count.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Drive every game with a competent bot
        run: node test/balance.mjs | tee balance-report.txt
      - name: Publish the report
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: balance-report.txt
